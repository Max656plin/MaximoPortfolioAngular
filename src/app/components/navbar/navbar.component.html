<nav class="site-navbar">
  <div class="container d-flex align-items-center justify-content-between">

    <!-- Logo con inicial circular -->
    <a class="navbar-logo" routerLink="/">
      <span class="logo-circle">M</span>
      <span class="logo-text">Máximo Casado Giner</span>
    </a>

    <!-- Botón hamburguesa (mobile) -->
    <button class="nav-hamburger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
      aria-label="Abrir menú">
      <span class="ham-line" [class.open]="isMenuOpen"></span>
      <span class="ham-line" [class.open]="isMenuOpen"></span>
      <span class="ham-line" [class.open]="isMenuOpen"></span>
    </button>

    <!-- Links de navegación -->
    <div class="nav-links" [class.open]="isMenuOpen">
      <a class="nav-link-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">Inicio</a>

      <a class="nav-link-item" routerLink="/portfolio" routerLinkActive="active" (click)="closeMenu()">Portfolio</a>

      <a class="nav-link-item" routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a>

      <!-- Toggle de tema -->
      <button class="theme-toggle" (click)="toggleTheme()" [title]="isDarkTheme ? 'Modo Claro' : 'Modo Oscuro'">
        <i [class]="isDarkTheme ? 'bi bi-sun-fill' : 'bi bi-moon-fill'"></i>
        <span>{{ isDarkTheme ? 'Claro' : 'Oscuro' }}</span>
      </button>
    </div>

  </div>
</nav>
