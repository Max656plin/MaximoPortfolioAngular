<div class="project-card-custom">

  <!-- Número de proyecto (decorativo en el fondo) -->
  <span class="card-project-number">{{ (index + 1).toString().padStart(2, '0') }}</span>

  <!-- Título -->
  <h5 class="card-project-title">{{ project.title | uppercase }}</h5>

  <!-- Descripción -->
  <p class="card-project-desc">{{ project.description }}</p>

  <!-- Tecnologías (badges) -->
  @if (project.technologies && project.technologies.length > 0) {
  <div class="card-techs">
    @for (tech of project.technologies; track tech) {
    <span class="badge bg-info text-dark">{{ tech }}</span>
    }
  </div>
  }

  <!-- Footer con link a GitHub -->
  @if (project.githubLink) {
  <div class="card-footer-custom">
    <a [href]="project.githubLink" target="_blank" rel="noopener noreferrer" class="btn-github">
      <i class="bi bi-github"></i> Ver en GitHub
    </a>
  </div>
  }

</div>
